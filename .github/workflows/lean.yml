name: Experimental Lean proofs

on:
  push:
    branches:
      - main
    paths:
      - 'PWFA/**'
      - 'PWFA.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'scripts/audit-phase.lean'
      - 'scripts/audit-extensions.lean'
      - 'scripts/experiments/*.lean'
      - 'scripts/check-lean-experiments.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-phase:
    name: Build experimental Lean modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject admitted proofs and custom axioms
        shell: bash
        run: |
          status=0
          git grep -n -w -E 'sorry|admit|axiom' -- PWFA.lean ':(glob)PWFA/**/*.lean' ':(glob)scripts/experiments/*.lean' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Disallowed proof hole or axiom found in experimental Lean source."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Verify committed dependency manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("lake-manifest.json").read_text())
          assert data["name"] == "pwfa"
          assert any(
              pkg["name"] == "mathlib"
              and pkg["rev"] == "56a005855ea17e0b0958f73ec801ae140b0a1679"
              for pkg in data["packages"]
          )
          print("Lockfile verified: mathlib v4.35.0 Git commit")
          PY

      - name: Set up Lean and build the project
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Audit phase statement types and axiom dependencies
        run: lake env lean scripts/audit-phase.lean

      - name: Audit experimental extensions
        run: lake env lean scripts/audit-extensions.lean

      - name: Check research experiments
        run: bash scripts/check-lean-experiments.sh
