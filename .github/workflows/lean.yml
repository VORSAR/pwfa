name: Experimental Lean proofs

on:
  push:
    branches:
      - main
    paths:
      - 'PWFA/**'
      - 'PWFA.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-phase:
    name: Build experimental phase proofs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject admitted proofs and custom axioms
        shell: bash
        run: |
          if grep -RInE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' PWFA --include='*.lean'; then
            echo "Disallowed proof hole or axiom found in experimental Lean source."
            exit 1
          fi

      - name: Set up Lean and compile phase module
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
